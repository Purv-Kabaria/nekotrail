[package]
name = "nekotrail"
version = "0.23.0"
description = "Run many coding agents in parallel on your own machine, each in its own git worktree and branch, and ship each one as a pull request."
authors = ["Harshil Jani"]
license = "MIT"
repository = "https://github.com/Harshil-Jani/nekotrail"
homepage = "https://harshil-jani.github.io/nekotrail/"
readme = "../README.md"
keywords = ["coding-agents", "worktree", "tauri", "claude", "codex"]
categories = ["development-tools"]
publish = false
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nekotrail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rusqlite = { version = "0.37", features = ["bundled"] }
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7"
anyhow = "1"
libc = "0.2"
rand = "0.9"
sha2 = "0.10"
toml = "0.8"
toml_edit = "0.25"
trash = "5"
regex = "1"
quick-xml = "0.42"
# Away alerts (alerts.rs): the HTTP client and TLS setup the updater already brings in.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Annotate in the Preview tab snapshots the WKWebView (these crates are already in the tree through wry).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }
# Away alerts keep their tokens and webhook URLs in the login keychain.
keyring = { version = "3", features = ["apple-native"] }
# Banners with a subtitle and the mascot on the right (notice.rs); already in the tree through the notification plugin.
mac-notification-sys = "0.6"

# On Linux, Annotate snapshots the WebKitGTK view instead (also already in the tree through wry; png
# lets cairo write the snapshot out).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
cairo-rs = { version = "0.18", default-features = false, features = ["png"] }
# Away alerts keep their tokens and webhook URLs in the Secret Service (GNOME Keyring, KWallet).
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
